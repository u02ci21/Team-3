<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  

  <link rel="stylesheet" href="style.css">
</head>
<body>
 
    <div class ="wrapper">
      
      <form action="action_page.php" method="POST">
        <h1>Login</h1>
        
        <div class ="input-box"><!--sets the username and password box, each use placeholders to say what the text field is for -->
          
          <input type="text" placeholder="Username" required>
        </div>

        <div class="input-box">
         
          <input type ="password" 
          placeholder="Password" required>
        </div>

      <div class="remeberForgot"> <!-- sets the checkbox for remembering login details,  and also sets the hyperlink for account recovery (although maybe we won't implement that)-->
        <label><input type="checkbox"> Remember me
        </label>

        <br>

        <a href="#">Forgot password</a>

        <br>
      </div>

      <div>
        <button type="submit" class="btn">Login</button>

        <br>
        <br>
        
        <div class="LinkToRegister"> <!-- hyperlink to send to the other html page-->
          <p>Don't have an account? 
          <a href="#">Register Here</a></p>
        </div>
      </div>


    </form>
  </div>
</body>
</html>
