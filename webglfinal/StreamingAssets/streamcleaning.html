<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Stream Cleaning Minigame</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #a3d9ff;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 10px;
    }

    #gameWrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
    }

    #gameContainer {
      position: relative;
      width: 800px;
      height: 400px;
      border: 4px solid #263136;
      border-radius: 10px;
      overflow: hidden;
      transition: background 0.5s ease;
      background-color: rgb(139, 69, 19);
      transition: background-color 0.5s ease;
}
    .trash {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgb(126, 126, 126);
      cursor: not-allowed;
      user-select: none;
    }

    #dustbin {
      width: 120px;
      height: 120px;
      background: rgb(38, 38, 38);
      border: 3px solid black;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      font-weight: bold;
      flex-shrink: 0;
    }

    #timer {
      font-size: 24px;
      font-weight: bold;
    }

    #message {
      font-size: 28px;
      font-weight: bold;
      color: #222;
    }

    #startButton {
      font-size: 20px;
      font-weight: bold;
      padding: 10px 20px;
      border: none;
      border-radius: 8px;
      background-color: #0077b6;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
    }

    #startButton:hover {
      background-color: #0096c7;
    }
  </style>
</head>
<body>
  <div id="gameWrapper">
    <div id="gameContainer"></div>
    <div id="dustbin">BIN</div>
  </div>

  <button id="startButton">Start Game</button>
  <div id="timer">Time Left: 10</div>
  <div id="message"></div>

  <script>
    const gameContainer = document.getElementById("gameContainer");
    const dustbin = document.getElementById("dustbin");
    const timerDisplay = document.getElementById("timer");
    const message = document.getElementById("message");
    const startButton = document.getElementById("startButton");

    let trashCount = 5;
    let trashes = [];
    let timeLeft = 10;
    let timer;
    let collected = 0;
    let gameActive = false;

function updateStreamColor() {
  const progress = collected / trashCount; 

  // Brown (dirty)
  const r1 = 139, g1 = 69, b1 = 19;
  // Blue (clean)
  const r2 = 0, g2 = 119, b2 = 182;

  const r = Math.round(r1 + (r2 - r1) * progress);
  const g = Math.round(g1 + (g2 - g1) * progress);
  const b = Math.round(b1 + (b2 - b1) * progress);

  gameContainer.style.backgroundColor = `rgb(${r}, ${g}, ${b})`;
}



    // Spawn Trash
    function spawnTrash() {
      const rect = gameContainer.getBoundingClientRect();

      for (let i = 0; i < trashCount; i++) {
        const trash = document.createElement("div");
        trash.classList.add("trash");

        const startX = rect.left + Math.random() * (rect.width - 40);
        const startY = rect.top + Math.random() * (rect.height - 40);
        trash.style.left = startX + "px";
        trash.style.top = startY + "px";

        document.body.appendChild(trash);

        trash.vx = (Math.random() * 1 - 0.5) * 0.3;
        trash.vy = (Math.random() * 1 - 0.5) * 0.2;
        trash.phase = Math.random() * Math.PI * 2;
        trashes.push(trash);

        let offsetX, offsetY, dragging = false;

        trash.addEventListener("mousedown", (e) => {
          if (!gameActive) return;
          dragging = true;
          offsetX = e.offsetX;
          offsetY = e.offsetY;
          trash.style.cursor = "grabbing";
          trash.dragging = true;
        });

        document.addEventListener("mouseup", (e) => {
          if (!dragging) return;
          dragging = false;
          trash.style.cursor = gameActive ? "grab" : "not-allowed";
          trash.dragging = false;
          if (gameActive) checkDrop(trash);
        });

        document.addEventListener("mousemove", (e) => {
          if (!dragging || !gameActive) return;
          trash.style.left = e.pageX - offsetX + "px";
          trash.style.top = e.pageY - offsetY + "px";
        });
      }
    }

    //Floating Animation
    function floatTrash() {
      if (!gameActive) return;

      const rect = gameContainer.getBoundingClientRect();

      trashes.forEach((trash) => {
        if (trash.dragging) return;

        let x = parseFloat(trash.style.left);
        let y = parseFloat(trash.style.top);

        trash.phase += 0.005;
        y += Math.sin(trash.phase) * 0.2;

        x += trash.vx;
        y += trash.vy;

        if (x <= rect.left) {
          x = rect.left;
          trash.vx *= -1;
        }
        if (x >= rect.right - 40) {
          x = rect.right - 40;
          trash.vx *= -1;
        }
        if (y <= rect.top) {
          y = rect.top;
          trash.vy *= -1;
        }
        if (y >= rect.bottom - 40) {
          y = rect.bottom - 40;
          trash.vy *= -1;
        }

        trash.style.left = x + "px";
        trash.style.top = y + "px";
      });

      requestAnimationFrame(floatTrash);
    }

    //Drop Check
    function checkDrop(trash) {
      const trashRect = trash.getBoundingClientRect();
      const binRect = dustbin.getBoundingClientRect();

      if (
        trashRect.left < binRect.right &&
        trashRect.right > binRect.left &&
        trashRect.top < binRect.bottom &&
        trashRect.bottom > binRect.top
      ) {
        trash.remove();
        collected++;
        updateStreamColor();
        if (collected === trashCount) endGame(true);
      }
    }

    //Timer
    function startTimer() {
      timerDisplay.textContent = `Time Left: ${timeLeft}`;
      timer = setInterval(() => {
        if (!gameActive) return;
        timeLeft--;
        timerDisplay.textContent = `Time Left: ${timeLeft}`;
        if (timeLeft <= 0) endGame(false);
      }, 1000);
    }

    //End Game
    function endGame(won) {
      gameActive = false;
      clearInterval(timer);
      message.textContent = won
        ? "You cleaned the stream!"
        : "Time’s up!";
      trashes.forEach(t => t.style.cursor = "not-allowed");

      if (won) {
        collected = trashCount;
        updateStreamColor();
      }
    }

    //Start Game
    startButton.addEventListener("click", () => {
      gameActive = true;
      startButton.disabled = true;
      startButton.style.opacity = 0.6;
      startButton.textContent = "Drag the trash to the bin!";
      trashes.forEach(t => t.style.cursor = "grab");
      startTimer();
      requestAnimationFrame(floatTrash);
    });

  
    spawnTrash();
    updateStreamColor();
  </script>
</body>
</html>
