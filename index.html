<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>The Sustainables</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: sans-serif; 
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background-image: url('backgroundHomepage.jpg'); /* replace background.png with your image filename */
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-color: #fff; /* fallback if image doesn't load */
        }

        .card {
            background: white;
            max-width: 400px;
            width: 100%;
            margin-top: 60px;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        h1 { text-align: center; margin-bottom: 20px; }
        .tabs { display: flex; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; background: #eee; border: 1px solid #ccc; cursor: pointer; }
        .tab.active { background: white; border-bottom: none; }
        .form-section { display: none; }
        .form-section.active { display: block; }
        label { display: block; margin-top: 10px; }
        input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; }
        button[type="submit"] { width: 100%; padding: 10px; margin-top: 15px; cursor: pointer; }
        .link-button { background: none; border: none; color: #06c; text-decoration: underline; cursor: pointer; padding: 0; font-size: 14px; margin-top: 10px; }
        .message { padding: 10px; margin-bottom: 15px; display: none; }
        .message.error { background: #fdd; color: #900; display: block; }
        .message.success { background: #dfd; color: #060; display: block; }
    </style>
</head>
<body>
    <div class="card">
    <h1>The Sustainables</h1>

    <div class="tabs">
        <button type="button" class="tab active" id="tab-login" onclick="switchTab('login')">Log In</button>
        <button type="button" class="tab" id="tab-signup" onclick="switchTab('signup')">Sign Up</button>
    </div>

    <div id="login-section" class="form-section active">
        <div id="login-message" class="message"></div>
        <form id="login-form" novalidate>
            <label>Email <input type="email" id="login-email"></label>
            <label>Password <input type="password" id="login-password"></label>
            <button type="submit" id="login-btn">Log In</button>
            <button type="button" class="link-button" onclick="switchTab('forgot')">Forgot password?</button>
        </form>
    </div>

    <div id="signup-section" class="form-section">
        <div id="signup-message" class="message"></div>
        <form id="signup-form" novalidate>
            <label>Username <input type="text" id="signup-username"></label>
            <label>Date of Birth <input type="date" id="signup-dob"></label>
            <label>Email <input type="email" id="signup-email"></label>
            <label>Password <input type="password" id="signup-password"></label>
            <label style="margin-top:14px; font-size:14px;">
                <input type="checkbox" id="signup-terms" style="width:auto; margin-right:6px;">
                I agree to the <a href="terms.html" target="_blank">Terms and Conditions</a>
            </label>
            <button type="submit" id="signup-btn">Sign Up</button>
        </form>

        <div id="parental-consent" style="display:none;">
            <p style="margin-bottom:12px;">You need a parent or guardian to sign up for you as you are under 13.</p>
            <p style="margin-bottom:16px;">Please ask them to enter their email below. We will send them a verification link to confirm your account.</p>
            <div id="parental-message" class="message"></div>
            <form id="parental-form" novalidate>
                <label>Parent or Guardian Email <input type="email" id="parent-email"></label>
                <label style="margin-top:14px; font-size:14px;">
                    <input type="checkbox" id="parental-terms" style="width:auto; margin-right:6px;">
                    I agree to the <a href="terms.html" target="_blank">Terms and Conditions</a> on behalf of my child
                </label>
                <button type="submit" id="parental-btn">Send Verification Link</button>
                <button type="button" class="link-button" onclick="showSignupForm()">Back</button>
            </form>
        </div>
    </div>

    <div id="forgot-section" class="form-section">
        <div id="forgot-message" class="message"></div>
        <p>Enter your email and we'll send you a link to reset your password.</p>
        <form id="forgot-form" novalidate>
            <label>Email <input type="email" id="forgot-email"></label>
            <button type="submit" id="forgot-btn">Send Reset Link</button>
            <button type="button" class="link-button" onclick="switchTab('login')">Back to log in</button>
        </form>
    </div>

    <script>
        const sb = window.supabase.createClient(
            'https://oynhlpajwzsjqknxcnxa.supabase.co',
            'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95bmhscGFqd3pzanFrbnhjbnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5OTg4NTMsImV4cCI6MjA5MTU3NDg1M30.SAlaBAgVkpDGQQJLZ9kCw27P-FxuGZDKUkmf_yPYJGo'
        );

        const GAME_PAGE = 'https://team3charlie.netlify.app/webglfinal/index.html';
        const VERIFY_URL = 'https://team3charlie.netlify.app/verify.html';
        const RESET_URL  = 'https://team3charlie.netlify.app/reset-password.html';

        let pendingSignup = null;

        // ---- HELPERS ----

        function msg(type, id, text) {
            const el = document.getElementById(id + '-message');
            if (!el) return;
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }

        function setBtn(id, disabled, text) {
            const btn = document.getElementById(id);
            btn.disabled = disabled;
            btn.textContent = text;
        }

        function getAge(dob) {
            const today = new Date(), birth = new Date(dob);
            let age = today.getFullYear() - birth.getFullYear();
            const m = today.getMonth() - birth.getMonth();
            if (m < 0 || (m === 0 && today.getDate() < birth.getDate())) age--;
            return age;
        }

        function isValidEmail(email) {
            return email.includes('@') && email.includes('.');
        }

        async function createAccount(email, password, username) {
            return sb.auth.signUp({
                email, password,
                options: { data: { username }, emailRedirectTo: VERIFY_URL }
            });
        }

        function switchTab(target) {
            ['login', 'signup'].forEach(t => {
                document.getElementById('tab-' + t).classList.toggle('active', t === target);
            });
            ['login', 'signup', 'forgot'].forEach(t => {
                document.getElementById(t + '-section').classList.toggle('active', t === target);
                const m = document.getElementById(t + '-message');
                if (m) m.style.display = 'none';
            });
            if (target === 'forgot') {
                document.getElementById('tab-login').classList.add('active');
            }
        }

        function showSignupForm() {
            document.getElementById('signup-form').style.display = 'block';
            document.getElementById('parental-consent').style.display = 'none';
        }

        // ---- SIGN UP ----

        document.getElementById('signup-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('signup-username').value.trim();
            const dob      = document.getElementById('signup-dob').value;
            const email    = document.getElementById('signup-email').value.trim();
            const password = document.getElementById('signup-password').value;

            if (username.length < 3)   return msg('error', 'signup', 'Username needs at least 3 letters.');
            if (!dob)                  return msg('error', 'signup', 'Please enter your date of birth.');
            if (!isValidEmail(email))  return msg('error', 'signup', 'Please enter a valid email address.');
            if (password.length < 6)   return msg('error', 'signup', 'Password needs at least 6 characters.');
            if (!document.getElementById('signup-terms').checked) return msg('error', 'signup', 'You must agree to the Terms and Conditions.');

            if (getAge(dob) < 13) {
                pendingSignup = { username, email, password };
                document.getElementById('signup-form').style.display = 'none';
                document.getElementById('parental-consent').style.display = 'block';
                return;
            }

            setBtn('signup-btn', true, 'Creating account...');
            try {
                const { data, error } = await createAccount(email, password, username);
                if (error) throw error;
                if (data.user?.identities?.length === 0) return msg('error', 'signup', 'That email is already registered. Try logging in.');
                msg('success', 'signup', 'Account created. Check your email to finish signing up.');
                document.getElementById('signup-form').reset();
            } catch (e) {
                msg('error', 'signup', e.message?.includes('already') ? 'That email is already registered.' : e.message || 'Something went wrong.');
            } finally {
                setBtn('signup-btn', false, 'Sign Up');
            }
        });

        // ---- PARENTAL CONSENT ----

        document.getElementById('parental-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const parentEmail = document.getElementById('parent-email').value.trim();

            if (!isValidEmail(parentEmail))          return msg('error', 'parental', 'Please enter a valid email address.');
            if (parentEmail === pendingSignup.email)  return msg('error', 'parental', 'Please enter a different email to your own.');
            if (!document.getElementById('parental-terms').checked) return msg('error', 'parental', 'You must agree to the Terms and Conditions.');

            setBtn('parental-btn', true, 'Sending...');
            try {
                // Sign up using the parent's email — Supabase sends the verification link to them
                const { data, error } = await createAccount(parentEmail, pendingSignup.password, pendingSignup.username);
                if (error) throw error;
                if (data.user?.identities?.length === 0) return msg('error', 'parental', 'That email is already registered.');
                msg('success', 'parental', 'Verification link sent to your parent or guardian. They need to click it to confirm the account.');
                pendingSignup = null;
            } catch (e) {
                msg('error', 'parental', e.message || 'Something went wrong. Please try again.');
            } finally {
                setBtn('parental-btn', false, 'Send Verification Link');
            }
        });

        // ---- LOG IN ----

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email    = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            if (!email)    return msg('error', 'login', 'Please type your email.');
            if (!password) return msg('error', 'login', 'Please type your password.');

            setBtn('login-btn', true, 'Loading...');
            try {
                const { data, error } = await sb.auth.signInWithPassword({ email, password });
                if (error) throw error;
                sessionStorage.setItem('sb_token', data.session.access_token);
                sessionStorage.setItem('sb_user_id', data.session.user.id);
                msg('success', 'login', 'Welcome back. Redirecting...');
                setTimeout(() => window.location.href = GAME_PAGE, 800);
            } catch (e) {
                msg('error', 'login', e.message?.includes('Email not confirmed')
                    ? 'Please check your email to confirm your account first.'
                    : 'Login failed. Check your email and password.');
                setBtn('login-btn', false, 'Log In');
            }
        });

        // ---- FORGOT PASSWORD ----

        document.getElementById('forgot-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgot-email').value.trim();

            if (!isValidEmail(email)) return msg('error', 'forgot', 'Please enter a valid email address.');

            setBtn('forgot-btn', true, 'Sending...');
            try {
                const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: RESET_URL });
                if (error) throw error;
                msg('success', 'forgot', 'If that email is registered, a reset link has been sent.');
                document.getElementById('forgot-form').reset();
            } catch (e) {
                msg('error', 'forgot', e.message || 'Something went wrong.');
            } finally {
                setBtn('forgot-btn', false, 'Send Reset Link');
            }
        });

        // ---- AUTO REDIRECT IF ALREADY LOGGED IN ----

        window.addEventListener('DOMContentLoaded', async () => {
            const { data: { session } } = await sb.auth.getSession();
            if (session) window.location.href = GAME_PAGE;
        });
    </script>
    </div>
</body>
</html>
