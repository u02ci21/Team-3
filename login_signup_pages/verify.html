<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Email Verified</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 60px auto;
            padding: 20px;
            text-align: center;
        }

        h1 {
            margin-bottom: 10px;
        }

        p {
            color: #555;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            padding: 10px 24px;
            background: #2e7d5b;
            color: white;
            text-decoration: none;
            border-radius: 6px;
        }

        a:hover {
            background: #256347;
        }

        .error {
            background: #fdd;
            color: #900;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div id="content">
        <p>Checking your verification link...</p>
    </div>

    <script>
        const SUPABASE_URL = 'https://oynhlpajwzsjqknxcnxa.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95bmhscGFqd3pzanFrbnhjbnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5OTg4NTMsImV4cCI6MjA5MTU3NDg1M30.SAlaBAgVkpDGQQJLZ9kCw27P-FxuGZDKUkmf_yPYJGo';

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        window.addEventListener('DOMContentLoaded', async () => {
            const content = document.getElementById('content');

            // Check if there's an error in the URL (e.g. expired link)
            const hash = window.location.hash;
            const params = new URLSearchParams(hash.replace('#', '?'));
            const errorCode = params.get('error_code');
            const errorDesc = params.get('error_description');

            if (errorCode) {
                content.innerHTML = `
                    <div class="error">
                        ${errorCode === 'otp_expired'
                            ? 'That verification link has expired. Please sign up again or request a new link.'
                            : 'Something went wrong: ' + (errorDesc || errorCode).replace(/\+/g, ' ')}
                    </div>
                    <a href="https://team3charlie.netlify.app/index.html">Back to Login</a>
                `;
                return;
            }

            // Check if the session is now active (meaning email was verified)
            const { data: { session } } = await sb.auth.getSession();

            if (session) {
                content.innerHTML = `
                    <h1>Email Verified!</h1>
                    <p>Your account is all set. Head back to the login page to start playing.</p>
                    <a href="https://team3charlie.netlify.app/index.html">Go to Login</a>
                `;
            } else {
                content.innerHTML = `
                    <h1>Email Verified!</h1>
                    <p>Your account has been confirmed. Go back to the login page to sign in.</p>
                    <a href="https://team3charlie.netlify.app/index.html">Go to Login</a>
                `;
            }
        });
    </script>
</body>
</html>
