<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            font-family: sans-serif;
            max-width: 400px;
            margin: 60px auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            box-sizing: border-box;
        }

        button[type="submit"] {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            cursor: pointer;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            display: none;
        }

        .message.error {
            background: #fdd;
            color: #900;
            display: block;
        }

        .message.success {
            background: #dfd;
            color: #060;
            display: block;
        }
    </style>
</head>
<body>
    <h1>Reset Password</h1>

    <div id="message" class="message"></div>

    <form id="reset-form" novalidate>
        <label>New Password
            <input type="password" id="new-password">
        </label>
        <label>Confirm Password
            <input type="password" id="confirm-password">
        </label>
        <button type="submit" id="reset-btn">Update Password</button>
    </form>

    <script>
        const SUPABASE_URL = 'https://oynhlpajwzsjqknxcnxa.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im95bmhscGFqd3pzanFrbnhjbnhhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5OTg4NTMsImV4cCI6MjA5MTU3NDg1M30.SAlaBAgVkpDGQQJLZ9kCw27P-FxuGZDKUkmf_yPYJGo';

        const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function showMessage(type, text) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
            el.style.display = 'block';
        }

        document.getElementById('reset-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            const btn = document.getElementById('reset-btn');

            if (newPassword.length < 6) {
                showMessage('error', 'Your password needs to be at least 6 characters.');
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage('error', 'Passwords do not match.');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Updating...';

            try {
                const { error } = await sb.auth.updateUser({ password: newPassword });

                if (error) throw error;

                showMessage('success', 'Password updated. Redirecting to log in...');

                setTimeout(() => {
                    window.location.href = 'https://team3charlie.netlify.app/index.html';
                }, 1500);

            } catch (error) {
                console.error('Reset error:', error);
                showMessage('error', error.message || 'Could not update password. The reset link may have expired.');
                btn.disabled = false;
                btn.textContent = 'Update Password';
            }
        });
    </script>
</body>
</html>
