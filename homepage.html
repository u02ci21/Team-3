<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Sustainables Academy</title>

    <style>
        body {
            margin: 0;
            font-family: 'Comic Sans MS', cursive, sans-serif;
            text-align: center;
            background-image: url("backgroundHomepage.jpg"); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: white;
            font-size: 3rem;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.4);
            margin-bottom: 40px;
        }

        .button-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .menu-button {
            padding: 15px 40px;
            font-size: 1.5rem;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            background-color: #ffcc00;
            color: #333;
            box-shadow: 0 6px #cc9900;
        }

        .menu-button:hover {
            transform: translateY(-3px);
            box-shadow: 0 9px #cc9900;
        }

        .menu-button:active {
            transform: translateY(2px);
            box-shadow: 0 4px #cc9900;
        }

        .logout {
            background-color: #ff6666;
            box-shadow: 0 6px #cc0000;
            color: white;
        }

        .logout:hover {
            box-shadow: 0 9px #cc0000;
        }

        .logout:active {
            box-shadow: 0 4px #cc0000;
        }
    </style>
</head>

<body>

<h1>Welcome to The Sustainables Academy</h1>

<div class="button-container">
    <button class="menu-button" onclick="goToLevels()">Level Selector</button>
    <button class="menu-button" onclick="goToSettings()">Settings</button>
    <button class="menu-button logout" onclick="logout()">Log Out</button>
</div>

<script>
    function goToLevels() {
       window.location.href = "";
    }

    function goToSettings() {
        window.location.href = "";
    }

    function logout() {
        alert("You have been logged out!");
        window.location.href = "login.html";
    }
</script>

</body>
</html>
